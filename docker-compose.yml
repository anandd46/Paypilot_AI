version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paypilot
      POSTGRES_PASSWORD: paypilot_pass
      POSTGRES_DB: paypilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypilot -d paypilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://paypilot:paypilot_pass@db:5432/paypilot_db
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-64-chars-minimum}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-demo_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-demo_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-demo_webhook}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        alembic upgrade head &&
        python -c 'import asyncio; from database.seed.seed import seed; asyncio.run(seed())' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    depends_on:
      - backend

volumes:
  postgres_data:
