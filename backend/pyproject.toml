[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "ISC", "T20"]
ignore = ["ANN101", "ANN102", "ANN401", "S101", "B008"]
exclude = ["alembic/"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN", "S", "T20"]
"database/*" = ["ANN", "T20"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
